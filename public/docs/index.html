<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Parkview API Documentation</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #171e27;
      --panel-2: #1d2630;
      --line: #2b3644;
      --text: #e8eef6;
      --muted: #93a0b0;
      --accent: #3d9cf0;
      --get: #2fbf71;
      --post: #3d9cf0;
      --put: #f0b429;
      --patch: #c084fc;
      --delete: #ef5b5b;
      --body: #7dd3fc;
      --query: #fbbf24;
      --pathp: #c4b5fd;
      --file: #fb7185;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; }
    a { color: inherit; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
    .layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    .sidebar { border-right: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; height: 100vh; overflow: auto; padding: 20px 16px; }
    .brand { font-size: 18px; font-weight: 700; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
    input[type="search"] {
      width: 100%; background: var(--panel-2); border: 1px solid var(--line); color: var(--text);
      border-radius: 8px; padding: 10px 12px; outline: none;
    }
    input[type="search"]:focus { border-color: var(--accent); }
    .stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 18px; }
    .chip { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--muted); }
    .nav a {
      display: flex; justify-content: space-between; align-items: center;
      text-decoration: none; padding: 8px 10px; border-radius: 8px; color: var(--muted);
    }
    .nav a:hover, .nav a.active { background: var(--panel-2); color: var(--text); }
    .count { font-size: 11px; color: var(--muted); }
    main { padding: 28px 32px 80px; max-width: 1100px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .lead { color: var(--muted); margin-bottom: 28px; max-width: 72ch; }
    .module { margin-bottom: 36px; }
    .module h2 { margin: 0 0 6px; font-size: 20px; }
    .module > p { margin: 0 0 14px; color: var(--muted); }
    .route {
      background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
      margin-bottom: 10px; overflow: hidden;
    }
    .route-head {
      display: grid; grid-template-columns: 78px 1fr auto; gap: 12px; align-items: center;
      padding: 10px 12px; cursor: pointer; width: 100%; background: none; border: 0; color: inherit; text-align: left;
    }
    .route-head:hover { background: var(--panel-2); }
    .method {
      display: inline-flex; justify-content: center; align-items: center;
      font-size: 11px; font-weight: 700; letter-spacing: .04em; border-radius: 6px; padding: 4px 0;
    }
    .GET { background: rgba(47,191,113,.15); color: var(--get); }
    .POST { background: rgba(61,156,240,.15); color: var(--post); }
    .PUT { background: rgba(240,180,41,.15); color: var(--put); }
    .PATCH { background: rgba(192,132,252,.15); color: var(--patch); }
    .DELETE { background: rgba(239,91,91,.15); color: var(--delete); }
    .path { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; word-break: break-all; }
    .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .route-body { display: none; padding: 0 14px 14px; border-top: 1px solid var(--line); }
    .route.open .route-body { display: block; }
    .group { margin-top: 12px; }
    .group h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .params { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
      padding: 4px 8px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
    }
    .kind { font-size: 10px; font-weight: 700; letter-spacing: .04em; }
    .kind.body { color: var(--body); }
    .kind.query { color: var(--query); }
    .kind.path { color: var(--pathp); }
    .kind.file { color: var(--file); }
    .empty { color: var(--muted); padding: 8px 0 0; font-size: 13px; }
    .sample {
      margin-top: 10px; background: #0b1016; border: 1px solid var(--line); border-radius: 8px;
      padding: 10px 12px; overflow: auto; color: #d7e3f0; font-size: 12px; line-height: 1.45;
    }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: relative; height: auto; }
      .route-head { grid-template-columns: 78px 1fr; }
      .meta { grid-column: 2; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">Parkview API</div>
      <div class="sub">School management endpoints</div>
      <input id="q" type="search" placeholder="Search path, method, handler, param..." />
      <div class="stats">
        <span class="chip" id="modCount"></span>
        <span class="chip" id="routeCount"></span>
      </div>
      <nav class="nav" id="nav"></nav>
    </aside>
    <main>
      <h1>API Documentation</h1>
      <p class="lead">

        Click an endpoint to see body, query, path, and file parameters extracted from the handlers.
        Most routes are POST under <code>/server</code>. HR stays on <code>/server/hr</code>.
      </p>
      <div id="content"></div>
    </main>
  </div>

    const q = document.getElementById('q');
    const nav = document.getElementById('nav');
    const content = document.getElementById('content');
    const modCount = document.getElementById('modCount');
    const routeCount = document.getElementById('routeCount');

    function allParams(r) {
      return [].concat(r.body || [], r.query || [], r.params || [], r.files || []);
    }

    function filter() {
      const term = q.value.trim().toLowerCase();
      return DATA.map(mod => {
        const routes = mod.routes.filter(r => {
          if (!term) return true;
          const hay = [r.method, r.path, r.handler, mod.title].concat(allParams(r)).join(' ').toLowerCase();
          return hay.includes(term);
        });
        return Object.assign({}, mod, { routes: routes });
      }).filter(mod => mod.routes.length);
    }

    function tags(list, kind) {
      return list.map(name => '<span class="tag"><span class="kind ' + kind + '">' + kind.toUpperCase() + '</span>' + name + '</span>').join('');
    }

    function sample(r) {
      const obj = {};
      (r.body || []).forEach(k => { obj[k] = ''; });
      if (!Object.keys(obj).length) return '';
      return '<pre class="sample">' + JSON.stringify(obj, null, 2) + '</pre>';
    }

    function paramBlock(r) {
      const sections = [];
      if (r.params && r.params.length) sections.push('<div class="group"><h4>Path params</h4><div class="params">' + tags(r.params, 'path') + '</div></div>');
      if (r.query && r.query.length) sections.push('<div class="group"><h4>Query params</h4><div class="params">' + tags(r.query, 'query') + '</div></div>');
      if (r.body && r.body.length) sections.push('<div class="group"><h4>Body fields</h4><div class="params">' + tags(r.body, 'body') + '</div>' + sample(r) + '</div>');
      if (r.files && r.files.length) sections.push('<div class="group"><h4>Files</h4><div class="params">' + tags(r.files, 'file') + '</div></div>');
      if (!sections.length) {
        return '<p class="empty">' + (r.note || 'No request parameters') + '</p>';
      }
      return sections.join('');
    }

    function paramSummary(r) {
      const n = allParams(r).length;
      return n ? n + ' param' + (n === 1 ? '' : 's') : 'no params';
    }

    function render() {
      const mods = filter();
      const total = mods.reduce((n, m) => n + m.routes.length, 0);
      modCount.textContent = mods.length + ' modules';
      routeCount.textContent = total + ' routes';
      nav.innerHTML = mods.map(m =>
        '<a href="#' + m.id + '"><span>' + m.title + '</span><span class="count">' + m.routes.length + '</span></a>'
      ).join('');
      if (!mods.length) {
        content.innerHTML = '<div class="empty">No matching endpoints.</div>';
        return;
      }
      content.innerHTML = mods.map(m => `
        <section class="module" id="${m.id}">
          <h2>${m.title}</h2>
          <p>${m.description} Prefix <code>${m.prefix}</code></p>
          ${m.routes.map((r, i) => `
            <div class="route" data-key="${m.id}-${i}">
              <button class="route-head" type="button">
                <span class="method ${r.method}">${r.method}</span>
                <span class="path">${r.path}</span>
                <span class="meta">${paramSummary(r)}</span>
              </button>
              <div class="route-body">${paramBlock(r)}</div>
            </div>
          `).join('')}
        </section>
      `).join('');
    }

    content.addEventListener('click', (e) => {
      const btn = e.target.closest('.route-head');
      if (!btn) return;
      btn.parentElement.classList.toggle('open');
    });
    q.addEventListener('input', render);
    render();
  </script>
